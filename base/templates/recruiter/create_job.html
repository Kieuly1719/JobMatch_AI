{% extends "layouts/recruiter_base.html" %}
{% block title %}Đăng tin mới{% endblock %}

{% block content %}

<h1 class="text-3xl font-bold mb-8">
    Đăng Tin Tuyển Dụng Mới
</h1>

<form method="POST" class="space-y-6 max-w-3xl bg-white p-8 rounded-2xl shadow border">
    {% csrf_token %}

    <div>
        <label class="block text-sm font-semibold mb-2">Tên công ty</label>
        {{ form.company_name }}
    </div>

    <div>
        <label class="block text-sm font-semibold mb-2">Tiêu đề công việc</label>
        {{ form.title }}
    </div>

    <div>
        <label class="block text-sm font-semibold mb-2">Địa điểm</label>
        {{ form.location }}
    </div>

    <div>
        <label class="block text-sm font-semibold mb-2">Mô tả</label>
        {{ form.description }}
    </div>

    <div class="flex justify-end">
        <button type="submit"
            class="bg-primary hover:bg-primary/90 text-white px-8 py-3 rounded-xl font-bold shadow">
            Đăng tin
        </button>
    </div>
</form>

{% endblock %}

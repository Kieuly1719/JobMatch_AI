<div id="deleteModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
  <div class="bg-white dark:bg-slate-900 rounded-xl shadow-xl p-6 w-full max-w-md">
    <h2 class="text-xl font-bold text-red-600 mb-3 flex items-center gap-2">
      <span class="material-symbols-outlined">warning</span>
      Cảnh báo
    </h2>

    <p class="text-sm text-slate-600 mb-4">Bạn có chắc chắn muốn xóa tin tuyển dụng này không?</p>

    <p id="deleteJobTitle" class="font-semibold mb-6"></p>

    <form id="deleteForm" method="POST">
      {% csrf_token %}

      <div class="flex justify-end gap-3">
        <button type="button" onclick="closeDeleteModal()" class="px-4 py-2 bg-gray-200 rounded-lg">Hủy bỏ</button>

        <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg">Xác nhận xóa</button>
      </div>
    </form>
  </div>
</div>

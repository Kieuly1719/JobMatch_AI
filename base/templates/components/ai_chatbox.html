<button id="ai-chat-btn" class="fixed bottom-6 right-6 z-50 w-14 h-14 bg-primary text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-transform cursor-pointer">
    <span class="material-symbols-outlined text-3xl">smart_toy</span>
</button>

<div id="ai-chat-window" class="fixed bottom-24 right-6 z-50 w-[350px] sm:w-[400px] h-[500px] bg-white rounded-2xl shadow-2xl border border-slate-200 hidden flex-col overflow-hidden transition-all">
    
    <div class="p-4 bg-white border-b border-slate-100 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="relative">
                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center border border-primary/20">
                    <span class="material-symbols-outlined text-primary">smart_toy</span>
                </div>
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
            </div>
            <div>
                <h3 class="text-slate-800 font-bold text-base">Trợ lý AI</h3>
                <p class="text-green-500 text-xs font-medium mt-0.5">Trực tuyến</p>
            </div>
        </div>
        <button id="close-chat-btn" class="text-slate-400 hover:text-red-500 transition-colors">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
        
        <div class="flex justify-center mb-2">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest bg-slate-200 px-3 py-1 rounded-full">
                Hôm nay
            </span>
        </div>

        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-md">
                <span class="material-symbols-outlined text-white text-xs">smart_toy</span>
            </div>
            <div class="max-w-[85%]">
                <div class="p-3 rounded-2xl rounded-tl-none bg-white border border-slate-100 shadow-sm">
                    <p class="text-slate-700 text-sm">Chào bạn 👋 Mình là trợ lý AI hướng nghiệp. Mình có thể giúp gì cho bạn hôm nay?</p>
                </div>
            </div>
        </div>
    </div>

    <div class="p-3 bg-white border-t border-slate-100 z-10">
        <div class="flex items-center gap-2 bg-slate-100 rounded-full p-1.5 px-2 focus-within:ring-2 ring-primary/30 transition-all">
            <input type="text" id="chat-input" class="flex-1 bg-transparent border-none focus:ring-0 text-sm px-2 outline-none" placeholder="Nhập câu hỏi..." autocomplete="off">
            <button id="send-chat-btn" class="w-9 h-9 bg-primary text-white rounded-full flex items-center justify-center hover:bg-primary/90 transition-colors shrink-0 shadow-md">
                <span class="material-symbols-outlined text-sm ml-1">send</span>
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatBtn = document.getElementById('ai-chat-btn');
    const closeBtn = document.getElementById('close-chat-btn');
    const chatWindow = document.getElementById('ai-chat-window');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-chat-btn');
    const messagesBox = document.getElementById('chat-messages');

    if (!chatBtn || !sendBtn) return;

    // 1. MỞ / ĐÓNG CHATBOX
    chatBtn.addEventListener('click', () => {
        chatWindow.classList.remove('hidden');
        chatWindow.classList.add('flex');
        // Tuỳ chọn: Có thể thêm chatBtn.classList.add('hidden') nếu muốn ẩn nút tròn khi mở chat
    });

    closeBtn.addEventListener('click', () => {
        chatWindow.classList.add('hidden');
        chatWindow.classList.remove('flex');
    });

    // 2. HÀM IN TIN NHẮN VỚI GIAO DIỆN XỊN
    function appendMessage(text, isUser) {
        let msgHTML = '';
        if (isUser) {
            msgHTML = `
            <div class="flex justify-end mt-2">
                <div class="max-w-[85%] p-3 rounded-2xl rounded-tr-none bg-primary text-white shadow-sm">
                    <p class="text-sm whitespace-pre-wrap">${text}</p>
                </div>
            </div>`;
        } else {
            msgHTML = `
            <div class="flex items-start gap-3 mt-2">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-md">
                    <span class="material-symbols-outlined text-white text-xs">smart_toy</span>
                </div>
                <div class="max-w-[85%] p-3 rounded-2xl rounded-tl-none bg-white border border-slate-100 shadow-sm">
                    <p class="text-slate-700 text-sm whitespace-pre-wrap">${text}</p>
                </div>
            </div>`;
        }
        messagesBox.insertAdjacentHTML('beforeend', msgHTML);
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    // 3. GỌI API & XỬ LÝ GỬI TIN NHẮN
    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        appendMessage(text, true);
        chatInput.value = '';

        // Hiệu ứng "AI đang gõ..."
        const loadingId = 'loading-' + Date.now();
        const loadingHTML = `
            <div id="${loadingId}" class="flex items-start gap-3 mt-2">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-md">
                    <span class="material-symbols-outlined text-white text-xs">smart_toy</span>
                </div>
                <div class="max-w-[85%] p-4 rounded-2xl rounded-tl-none bg-white border border-slate-100 shadow-sm flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></span>
                    <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.15s"></span>
                    <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></span>
                </div>
            </div>`;
        messagesBox.insertAdjacentHTML('beforeend', loadingHTML);
        messagesBox.scrollTop = messagesBox.scrollHeight;

        try {
            const response = await fetch('{% url "ask_ai" %}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if(data.success) {
                appendMessage(data.reply, false);
            } else {
                appendMessage("Lỗi hệ thống: " + data.error, false);
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage("Lỗi kết nối máy chủ!", false);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
});
</script>

<!-- ================= AI FLOATING BUTTON ================= -->
<button id="ai-toggle"
    class="fixed bottom-6 right-6 z-50 w-14 h-14 bg-primary text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition">
    <span class="material-symbols-outlined">smart_toy</span>
</button>


<!-- ================= AI CHATBOX ================= -->
<div id="ai-chatbox"
     class="fixed bottom-6 right-6 z-50 w-full max-w-[420px]
            opacity-0 translate-y-10 pointer-events-none
            transition-all duration-300">

    <div class="flex flex-col h-[650px] bg-background-light dark:bg-background-dark border border-slate-200 dark:border-primary/20 rounded-xl overflow-hidden shadow-2xl">

        <!-- HEADER -->
        <div class="p-4 bg-white dark:bg-background-dark border-b border-slate-100 dark:border-primary/10">
            <div class="flex items-center justify-between">

                <div class="flex items-center gap-3">
                    <div class="relative">
                        <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center border-2 border-primary/20">
                            <span class="material-symbols-outlined text-primary">smart_toy</span>
                        </div>
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-background-dark rounded-full"></div>
                    </div>
                    <div>
                        <h3 class="text-slate-900 dark:text-slate-100 font-bold text-base">
                            Trợ lý AI
                        </h3>
                        <p class="text-primary text-xs font-medium mt-1 uppercase tracking-wider">
                            Trực tuyến
                        </p>
                    </div>
                </div>

                <!-- CLOSE BUTTON -->
                <button id="ai-close"
                    class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
        </div>


        <!-- CHAT BODY -->
        <div id="chat-messages"
             class="flex-1 overflow-y-auto p-4 space-y-6 custom-scrollbar">

            <div class="flex justify-center">
                <span class="text-[11px] font-medium text-slate-400 uppercase tracking-widest bg-slate-100 px-3 py-1 rounded-full">
                    Hôm nay
                </span>
            </div>

            <!-- AI MESSAGE -->
            <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined text-white text-sm">smart_toy</span>
                </div>

                <div class="max-w-[85%]">
                    <div class="p-4 rounded-2xl rounded-tl-none bg-white border shadow-sm">
                        <p class="text-slate-800 text-sm">
                            Chào bạn 👋 Tôi có thể giúp gì cho bạn hôm nay?
                        </p>
                    </div>
                </div>
            </div>

        </div>


        <!-- INPUT -->
        <div class="p-4 bg-white border-t">
            <div class="relative flex items-end gap-2 bg-slate-100 rounded-2xl p-2">

                <textarea id="chat-input"
                    class="flex-1 bg-transparent border-none focus:ring-0 text-sm resize-none"
                    placeholder="Nhập tin nhắn..."
                    rows="1"></textarea>

                <button id="send-message"
                    class="bg-primary text-white p-2 rounded-xl hover:bg-primary/90 transition active:scale-95">
                    <span class="material-symbols-outlined">send</span>
                </button>

            </div>
        </div>

    </div>
</div>



<!-- ================= SCRIPT ================= -->
<script>
    const toggleBtn = document.getElementById('ai-toggle');
    const chatbox = document.getElementById('ai-chatbox');
    const closeBtn = document.getElementById('ai-close');
    const sendBtn = document.getElementById('send-message');
    const input = document.getElementById('chat-input');
    const messages = document.getElementById('chat-messages');

    // OPEN
    toggleBtn.addEventListener('click', () => {
        chatbox.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
    });

    // CLOSE
    closeBtn.addEventListener('click', () => {
        chatbox.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
    });

    // SEND MESSAGE (UI DEMO)
    sendBtn.addEventListener('click', () => {
        const text = input.value.trim();
        if (!text) return;

        const userMessage = `
            <div class="flex justify-end">
                <div class="p-4 rounded-2xl rounded-tr-none bg-primary text-white max-w-[85%]">
                    <p class="text-sm">${text}</p>
                </div>
            </div>
        `;

        messages.insertAdjacentHTML('beforeend', userMessage);
        input.value = "";

        messages.scrollTop = messages.scrollHeight;
    });
</script>

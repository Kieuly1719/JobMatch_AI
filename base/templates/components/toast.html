{% if toast %}
<div id="toast-wrapper" class="fixed top-6 right-6 z-50 space-y-4">

    <div id="toast"
         class="relative flex gap-4 w-[380px] p-5 rounded-2xl shadow-xl bg-white
         border-l-4
         {% if toast.type == 'success' %} border-green-500
         {% elif toast.type == 'error' %} border-red-500
         {% elif toast.type == 'warning' %} border-yellow-500
         {% else %} border-blue-500
         {% endif %}
         animate-slideIn">

        <!-- Icon -->
        <div class="flex items-start">
            <div class="size-10 rounded-full flex items-center justify-center
                {% if toast.type == 'success' %} bg-green-100 text-green-600
                {% elif toast.type == 'error' %} bg-red-100 text-red-600
                {% elif toast.type == 'warning' %} bg-yellow-100 text-yellow-600
                {% else %} bg-blue-100 text-blue-600
                {% endif %}">
                <span class="material-symbols-outlined">
                    {% if toast.type == 'success' %} check_circle
                    {% elif toast.type == 'error' %} error
                    {% elif toast.type == 'warning' %} warning
                    {% else %} info
                    {% endif %}
                </span>
            </div>
        </div>

        <!-- Content -->
        <div class="flex-1">
            <h4 class="font-bold text-lg">
                {{ toast.title }}
            </h4>
            <p class="text-sm text-slate-500 mt-1">
                {{ toast.message }}
            </p>
        </div>

        <!-- Close -->
        <button onclick="closeToast()" class="text-slate-400 hover:text-slate-700">
            <span class="material-symbols-outlined">close</span>
        </button>

    </div>

</div>

<script>
function closeToast() {
    const toast = document.getElementById("toast-wrapper");
    if (toast) toast.remove();
}

setTimeout(() => {
    closeToast();
}, 4000);
</script>

<style>
@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
.animate-slideIn {
    animation: slideIn 0.4s ease;
}
</style>

{% endif %}

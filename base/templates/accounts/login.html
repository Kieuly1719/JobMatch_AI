<!DOCTYPE html>
<html>
<head>
    <title>Đăng nhập</title>
</head>
<body>
    <h2>Đăng nhập Hệ thống</h2>

    {% if messages %}
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit">Đăng nhập</button>
    </form>
    
    <p>Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký ngay</a></p>
</body>
</html>
